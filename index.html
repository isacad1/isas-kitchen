<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isa's Kitchen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Isa's Kitchen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pinyon+Script&display=swap">
<style>
/* Layout: Nancy Meyers kitchen — a thin blue ticking-stripe wall with the logo tag in the middle, then a crisp white page with white cards; spaced caps for labels, Garamond to read, script only for the page title. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --tint:#F4F8FD; --sunk:#F1F5FA; --line:#DCE5F0;
  --ink:#2E3A46; --muted:#5E6A75;
  --blue:#4C6CA6; --blue-ink:#FFFFFF; --stripe:#D5E2F3; --mist:#EEF3FA;
  --leaf:#7E9C6B; --leaf-deep:#3E5F3A; --leaf-ink:#FFFFFF; --leaf-soft:#E3EBDC;
  --calamansi:#F2CF3D; --twine-deep:#6B5A10; --calamansi-soft:#FFF7D6;
  --talong:#8E3446; --danger:#8E3446;
  --shadow:0 1px 2px rgba(46,58,70,.05),0 6px 18px rgba(76,108,166,.08);
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-display:"EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;
  --f-body:"EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;
  --f-mono:"EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161C22; --surface:#222A33; --tint:#1B2229; --sunk:#2A333D; --line:#34404C;
  --ink:#ECEFF3; --muted:#A7B2BE;
  --blue:#A9C0EA; --blue-ink:#10161C; --stripe:#2E4466; --mist:#26334A;
  --leaf:#93AE80; --leaf-deep:#B5CDA6; --leaf-ink:#10161C; --leaf-soft:#25331F;
  --calamansi:#EBCF55; --twine-deep:#F0D978; --calamansi-soft:#3A3524;
  --talong:#E59AA8; --danger:#E59AA8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161C22; --surface:#222A33; --tint:#1B2229; --sunk:#2A333D; --line:#34404C;
  --ink:#ECEFF3; --muted:#A7B2BE;
  --blue:#A9C0EA; --blue-ink:#10161C; --stripe:#2E4466; --mist:#26334A;
  --leaf:#93AE80; --leaf-deep:#B5CDA6; --leaf-ink:#10161C; --leaf-soft:#25331F;
  --calamansi:#EBCF55; --twine-deep:#F0D978; --calamansi-soft:#3A3524;
  --talong:#E59AA8; --danger:#E59AA8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{color:var(--ink);font:400 17.5px/1.5 var(--f-body);background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.caps{font-family:var(--f-mono);font-weight:600;letter-spacing:.22em;text-transform:uppercase}

/* garden header: painted on a canvas, always on light linen like a printed card */
.garden{position:relative;height:250px;background:#FFFFFF repeating-linear-gradient(90deg,#D5E2F3 0 3px,transparent 3px 14px);border-bottom:1px solid var(--line);overflow:hidden;display:flex;justify-content:center;align-items:center}
.garden .lem{position:absolute;bottom:-18px;width:250px;pointer-events:none}
.garden .lem.l{left:calc(50% - 400px)}.garden .lem.r{right:calc(50% - 400px)}
@media (max-width:760px){.garden .lem{width:150px;bottom:-26px}.garden .lem.l{left:-34px}.garden .lem.r{right:-34px}}
.garden .wrap{width:100%;display:flex;justify-content:center;padding-block:28px 20px}
.logo-tag{position:relative;z-index:1;background:#FFFFFF;color:#2E3A46;border:1px solid #DCE5F0;border-radius:2px;box-shadow:0 1px 2px rgba(46,58,70,.06),0 10px 28px rgba(76,108,166,.14);padding:34px 44px 22px;text-align:center;display:grid;justify-items:center;min-width:0;max-width:100%}
.logo-tag::after{content:"";position:absolute;left:50%;bottom:-2px;width:44px;height:4px;margin-left:-22px;border-radius:2px;background:#F2CF3D}
.logo-tag .hole{position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#EEF3FA;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.logo-tag .bow{position:absolute;top:-42px;left:50%;width:120px;margin-left:-60px;pointer-events:none}
.logo-tag .arch{display:block;width:220px;height:30px;margin-bottom:-4px;overflow:visible}
.logo-tag .arch text{font:400 12px var(--f-mono);letter-spacing:.34em;fill:#2E3A46}
.brand .script{font:400 clamp(2.6rem,7vw,3.4rem)/1.05 var(--f-script);padding-inline:8px}
.brand .sub{font:600 .66rem/1 var(--f-mono);letter-spacing:.3em;text-transform:uppercase;margin-top:6px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:center;padding-block:6px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
nav.tabs a{text-decoration:none;color:var(--muted);font:600 .74rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;padding:12px 12px 10px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--calamansi)}

main{padding-block:32px 72px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:400 clamp(2.5rem,6vw,3.4rem)/1.1 var(--f-script);color:var(--ink);padding-right:10px}
h2{font:700 1.3rem/1.25 var(--f-body)}
h3{font:700 1.1rem/1.3 var(--f-body)}
.eyebrow{font:600 .7rem/1.3 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{background:var(--mist);border-left:3px solid var(--calamansi);border-radius:var(--r);padding:12px 16px;font-size:.92rem;margin-bottom:18px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px;font:600 .72rem/1.2 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:400 1.2rem/1 var(--f-body);color:var(--ink)}

/* week */
.planhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.planhead .grow{flex:1;min-width:0;display:grid;gap:6px}
.weeknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.headbtns{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:20px;font-size:.9rem;color:var(--muted)}
.stats b{font:700 1.15rem/1 var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.fiber{display:inline-flex;align-items:baseline;gap:6px}
.fiber i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.days{display:grid;gap:12px}
.colhead{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:12px;padding:0 16px;font:600 .66rem/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.day{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);align-items:stretch}
.day.today{background:var(--calamansi-soft);box-shadow:inset 4px 0 0 var(--calamansi),var(--shadow)}
.dname{display:grid;align-content:center;gap:2px}
.dname strong{font:600 1.1rem/1.1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.dname span{font-size:.78rem;color:var(--muted)}
.day.today .dname strong::after{content:" · today";font:400 .62rem var(--f-mono);letter-spacing:.16em;color:var(--muted)}
.slot{min-width:0;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:10px 12px;min-height:56px;display:grid;align-content:center;gap:2px}
.slot:hover{border-color:var(--blue);border-style:solid}
.slot .ml{display:none;font:600 .62rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.slot.filled{border:1px solid transparent;background:var(--tint)}
.slot.filled:hover{border-color:var(--blue)}
.slot .t{font:700 .98rem/1.25 var(--f-body);overflow-wrap:anywhere}
.slot .s{font-size:.75rem;color:var(--muted)}
.slot.empty .t{color:var(--muted);font-weight:400}
.slot.free .t{font-style:italic;font-weight:400}
.slot .hf{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--leaf);margin-right:7px;vertical-align:middle}
@media (max-width:760px){
  .colhead{display:none}
  .day{grid-template-columns:1fr;gap:8px}
  .dname{grid-auto-flow:column;justify-content:start;gap:10px;align-items:baseline}
  .slot{grid-template-columns:84px 1fr;align-items:center;column-gap:10px}
  .slot .ml{display:block;grid-row:span 2}
  .garden{height:230px}
  nav.tabs a{padding:12px 8px 10px;letter-spacing:.14em}
}

/* recipes */
.rtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
.tagchips{margin-top:-4px}
.tagchips .chip{font-size:.76rem}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.rcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 0;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.rcard>*{margin-inline:16px}
.rcard>.rthumb,.rcard>.rwash{margin-inline:0;width:100%}
.rwash{height:96px;margin:-16px 0 4px;background:var(--tint) right -10px center/auto 115% no-repeat;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.rcard:hover{transform:translateY(-2px)}}
.rcard h3{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:1.1rem}
.fav{color:var(--talong);font-size:1rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--ink)}
.tag.high-fiber{background:var(--leaf-soft);color:var(--leaf-deep)}
.tag.high-fiber::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--leaf);margin-right:5px;vertical-align:1px}
.tag.bulk{background:transparent;box-shadow:inset 0 0 0 1px var(--calamansi);color:var(--twine-deep)}
.empty-state{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:36px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty-state h2{font:400 2.4rem/1.1 var(--f-script)}
.rthumb{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;margin:-16px 0 4px}

/* grocery list cards */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.gcard ul{list-style:none;margin:0;padding:0;display:grid}
.gcard li+li{border-top:1px dotted var(--line)}
.gcard label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.gcard input{margin-top:4px;accent-color:var(--blue);width:16px;height:16px;flex:none}
.gcard .done{text-decoration:line-through;color:var(--muted)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(22,28,34,.4);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));display:grid;gap:16px;box-shadow:0 24px 60px rgba(22,28,34,.3)}
@media (max-width:600px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:92%;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.sheet h2{font:700 1.5rem/1.2 var(--f-body)}
.sheet .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet .row.end{justify-content:flex-end}
.sheet .between{justify-content:space-between}
.field{display:grid;gap:6px}
.field>span{font:600 .66rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:110px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr 1fr}}
.pick{display:grid;gap:2px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg)}
.pick button{text-align:left;border:0;background:transparent;border-radius:6px;padding:9px 10px;display:flex;justify-content:space-between;gap:10px;font-weight:700}
.pick button:hover,.pick button.on{background:var(--mist)}
.pick small{color:var(--muted);font:600 .62rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;align-self:center}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{accent-color:var(--blue);width:16px;height:16px}
.other summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.other[open] summary{margin-bottom:8px}
.detail ol,.detail ul{margin:0;padding-left:1.3em;display:grid;gap:6px}
.detail .ing li::marker{color:var(--leaf)}
.detail ol li::marker{color:var(--blue);font-weight:700}
.detail h3{font:600 .7rem/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.qty{font-weight:700}
.confirm{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photo{display:grid;gap:4px;font-size:.78rem;color:var(--muted)}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--mist)}
.photo .acts{display:flex;gap:8px;flex-wrap:wrap}
.photo .acts button{border:0;background:none;padding:0;color:var(--blue);font-size:.76rem;text-decoration:underline}
.photo .acts button.warn{color:var(--danger)}
.photo .cov{color:var(--ink);font-weight:700}

/* book */
.bookwrap{display:grid;gap:14px;justify-items:center}
.spread{display:flex;justify-content:center;width:100%;perspective:2400px;min-height:200px}
.pslot{position:relative;overflow:hidden;background:#FFFFFF;flex:none;box-shadow:0 18px 40px rgba(40,55,80,.16),0 2px 6px rgba(40,55,80,.08);backface-visibility:hidden}
.pslot.l{border-radius:3px 0 0 3px}.pslot.r{border-radius:0 3px 3px 0}.pslot.one{border-radius:3px}
.pslot.l::after,.pslot.r::after{content:"";position:absolute;top:0;bottom:0;width:46px;pointer-events:none}
.pslot.l::after{right:0;background:linear-gradient(90deg,transparent,rgba(30,40,60,.12))}
.pslot.r::after{left:0;background:linear-gradient(270deg,transparent,rgba(30,40,60,.10))}
.pscale{transform-origin:0 0;width:794px}
.pslot.blank{background:transparent;box-shadow:none}
.booknav{display:flex;align-items:center;gap:14px;font:600 .7rem/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.booknav span{min-width:160px;text-align:center;font-variant-numeric:tabular-nums}

/* sync + backup */
.syncbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.syncline{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:.8rem;color:var(--muted);margin:-14px 0 14px}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:.85rem}
.backup{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.printhost{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}

/* ---- paper pages: shared by the book view and the PDF (fixed paper colors) ---- */
.pp,.pg{width:794px;background:#FFFFFF;color:#2E3A46;font:400 16.5px/1.55 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;position:relative;box-sizing:border-box;text-align:left}
.pg{min-height:1123px;overflow:hidden}
.pg *,.pp *{box-sizing:border-box}
.pp{padding:56px 64px}
.pg .in{padding:64px 72px 96px;position:relative}
.pg .tickband{height:16px;background-repeat:repeat;border-bottom:1px solid #DCE5F0}
.pg .sprig,.pp .sprig{position:absolute;top:-4px;right:-30px;width:250px;height:200px;background:center/contain no-repeat;pointer-events:none}
.pg .head,.pp .brandline{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #E3DAC6;padding-bottom:10px;margin-bottom:30px;font:600 10px/1 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;letter-spacing:.3em;text-transform:uppercase;color:#2E3A46;position:relative}
.pg .head{max-width:520px}
.pg .ey,.pp .ey{font:600 10px/1 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;letter-spacing:.24em;text-transform:uppercase;color:#5E6A75;margin-bottom:6px}
.pg .title,.pp h1{font:400 64px/1.12 "Pinyon Script",cursive;color:#2E3A46;margin:6px 0 12px;padding-right:14px;max-width:560px}
.pg .lede{font:italic 400 17px/1.5 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;color:#5E6A75;max-width:540px;margin:0 0 24px}
.pg .facts{display:flex;gap:32px;border-top:1px solid #E3DAC6;border-bottom:1px solid #E3DAC6;padding:12px 0;margin-bottom:32px;flex-wrap:wrap}
.pg .facts div{display:grid;gap:4px}
.pg .facts b{font:700 18px/1 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;color:#2E3A46}
.pg .facts span{font:600 9px/1 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;letter-spacing:.22em;text-transform:uppercase;color:#5E6A75}
.pg .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;margin-right:4px;background:#EEF3FA}
.pg .cols{display:grid;grid-template-columns:230px 1fr;gap:46px}
.pg h2,.pp h2{display:inline-block;font:600 11px/1 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;letter-spacing:.26em;text-transform:uppercase;color:#4C6CA6;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid #F2CF3D}
.pg .ing{list-style:none;margin:0;padding:0}
.pg .ing li{padding:7px 0;border-bottom:1px dotted #E3DAC6;line-height:1.35}
.pg .steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.pg .steps li{display:grid;grid-template-columns:30px 1fr;align-items:start}
.pg .steps .n{font:700 15px/1.5 "EB Garamond",Garamond,"Adobe Garamond Pro",Georgia,serif;color:#4C6CA6}

<script>
/* Google sign-in key comes from config.js in the GitHub version (see README). */
const GOOGLE_CLIENT_ID=(window.ISA_CONFIG&&window.ISA_CONFIG.googleClientId)||"";
const CATS=[["almusal","Breakfast"],["ulam","Main dish"],["sabaw","Soup"],["gulay","Vegetables"],["merienda","Snack"]];
const CAT=Object.fromEntries(CATS);
const TAGS=["high-fiber","low-sodium","protein-packed","iron-rich","veggie-loaded","bulk","freezes","quick","baon-ready","budget-friendly","kid-friendly","comfort-food"];
const TAG_LABEL={bulk:"bulk-cook",freezes:"freezer-friendly","comfort-food":"comfort food","baon-ready":"lunchbox-ready"};
const tagLabel=t=>TAG_LABEL[t]||t;
const DAYS=[["mon","Mon","Monday"],["tue","Tue","Tuesday"],["wed","Wed","Wednesday"],["thu","Thu","Thursday"],["fri","Fri","Friday"],["sat","Sat","Saturday"],["sun","Sun","Sunday"]];
const MEALS=[["b","Breakfast"],["l","Lunch"],["d","Dinner"]];

const S={gview:"aisle",tag:"",bookPos:0,bookTwo:false,view:"plan",recipes:new Map(),recipesReady:false,plan:{meals:{},got:{}},planReady:false,
  week:null,mode:"loading",readOnly:false,stale:false,q:"",cat:"all"};
let db=null,unsubPlan=null,staleTimer=null,assetsNs=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);return x}
function fromKey(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return key(d)}
function defaultWeek(){const now=new Date();const m=mondayOf(now);const wd=now.getDay();if(wd===6||wd===0)m.setDate(m.getDate()+7);return key(m)}
function weekLabel(k){
  const a=fromKey(k),b=fromKey(addDays(k,6));
  const M=d=>d.toLocaleDateString("en-US",{month:"long"});
  const cur=key(mondayOf(new Date()));
  const rel=k===cur?"This week":k===addDays(cur,7)?"Next week":k===addDays(cur,-7)?"Last week":"";
  const range=a.getFullYear()!==b.getFullYear()?`${M(a)} ${a.getDate()}, ${a.getFullYear()} to ${M(b)} ${b.getDate()}, ${b.getFullYear()}`
    :a.getMonth()!==b.getMonth()?`${M(a)} ${a.getDate()} to ${M(b)} ${b.getDate()}, ${b.getFullYear()}`
    :`${M(a)} ${a.getDate()} to ${b.getDate()}, ${b.getFullYear()}`;
  return {range,rel};
}

/* ---------- storage ---------- */
const LS={get(k,f){try{const v=localStorage.getItem("kusina:"+k);return v?JSON.parse(v):f}catch{return f}},
  set(k,v){try{localStorage.setItem("kusina:"+k,JSON.stringify(v))}catch{}}};
let writeChain=Promise.resolve();
function queue(fn){writeChain=writeChain.then(fn).catch(onWriteError);return writeChain}
function onWriteError(e){
  if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("You can view this planner but not change it.");render()}
  else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Delete a few old recipes to make room.")}
  else toast("Couldn't save just now. Try again in a moment.");
}

async function init(){
  S.week=defaultWeek();
  route();render();
  let d=null;
  try{d=await window.claude?.use?.("db")}catch{d=null}
  if(d){db=d;S.mode="db";subscribeRecipes();subscribePlan();
    try{assetsNs=(await window.claude?.use?.("assets"))||null}catch{assetsNs=null}}
  else{S.mode=driveReady()?"drive":"local";
    DATA=loadDeviceData();applyData();
    if(S.mode==="drive"){restoreToken();if(tokenValid())syncDrive();else S.sync=LS.get("drive",{}).on?"auth":"off"}
    render()}
}
function armStale(){clearTimeout(staleTimer);staleTimer=setTimeout(()=>{S.stale=true;render()},10000)}
function subscribeRecipes(){
  armStale();
  db.collection("recipes").onSnapshot(snap=>{
    S.recipes=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    S.recipesReady=true;
    if(!snap.metadata.fromCache){clearTimeout(staleTimer);S.stale=false}
    render();
  },()=>{S.recipesReady=true;clearTimeout(staleTimer);S.stale=true;render()});
}
function subscribePlan(){
  if(unsubPlan)unsubPlan();
  S.planReady=false;
  const wk=S.week;
  unsubPlan=db.doc("plans/"+wk).onSnapshot(s=>{
    if(wk!==S.week)return;
    const d=s.exists?s.data():{};
    S.plan={meals:{...(d.meals||{})},got:{...(d.got||{})},extras:[...(d.extras||[])]};
    S.planReady=true;render();
  },()=>{S.planReady=true;render()});
}
function loadLocalPlan(){const p=(DATA&&DATA.plans[S.week])||{};S.plan={meals:{...(p.meals||{})},got:{...(p.got||{})},extras:[...(p.extras||[])]};S.planReady=true}
function savePlan(){
  const wk=S.week,body={meals:{...S.plan.meals},got:{...S.plan.got},extras:[...(S.plan.extras||[])],week:wk};
  if(S.mode==="db")queue(()=>db.doc("plans/"+wk).set(body));else{DATA.plans[wk]={meals:body.meals,got:body.got,extras:body.extras,updated:Date.now()};deviceChanged()}
  render();
}
function saveRecipe(r){
  const {id,...body}=r;
  S.recipes.set(id,r);
  if(S.mode==="db")queue(()=>db.collection("recipes").doc(id).set(body));
  else{const{updated,...b}=body;DATA.recipes[id]={...b,updated:Date.now()};deviceChanged()}
  render();
}
function deleteRecipe(id){
  S.recipes.delete(id);
  if(S.mode==="db")queue(()=>db.collection("recipes").doc(id).delete());
  else{delete DATA.recipes[id];DATA.deleted[id]=Date.now();deviceChanged()}
  render();
}
function newId(name){return (name||"recipe").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)+"-"+Math.random().toString(36).slice(2,6)}

/* ---------- routing ---------- */
function route(){const h=location.hash.slice(1);S.view=["plan","recipes","book","list"].includes(h)?h:"plan";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===S.view?"page":"false"))}
addEventListener("hashchange",()=>{route();render();scrollTo(0,0)});

/* ---------- helpers ---------- */
// A meal is a list of parts: "r:<recipe id>" for a recipe, "t:<text>" for anything else (rice, fruit, leftovers).
// Older plans stored one string per meal; parts() reads both.
const parts=v=>Array.isArray(v)?v.filter(Boolean):v?[v]:[];
function slotInfo(v){
  if(!v)return null;
  if(v.startsWith("r:")){const r=S.recipes.get(v.slice(2));return r?{kind:"r",r,text:r.name}:{kind:"t",text:"(deleted recipe)"}}
  return {kind:"t",text:v.slice(2)};
}
const mealParts=slot=>parts(S.plan.meals[slot]).map(slotInfo).filter(Boolean);
const isHF=i=>!!(i&&i.r&&(i.r.tags||[]).includes("high-fiber"));
function weekRecipes(){
  const m=new Map();
  for(const v of Object.values(S.plan.meals))for(const p of parts(v)){if(p.startsWith("r:")){const id=p.slice(2);if(S.recipes.has(id))m.set(id,(m.get(id)||0)+1)}}
  return m;
}
function setParts(slot,arr){if(arr.length)S.plan.meals[slot]=arr;else delete S.plan.meals[slot];savePlan()}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const shortDate=k=>fromKey(k).toLocaleDateString("en-US",{month:"short",day:"numeric"});

/* ---------- grocery list: merge items, add up amounts, sort by store section ---------- */
const UNITS={pc:"pc",pcs:"pc",piece:"pc",pieces:"pc",g:"g",gram:"g",grams:"g",kg:"kg",kilo:"kg",kilos:"kg",ml:"ml",l:"L",liter:"L",liters:"L",
  cup:"cup",cups:"cup",tbsp:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",bunch:"bunch",bunches:"bunch",
  clove:"clove",cloves:"clove",thumb:"thumb",thumbs:"thumb",pack:"pack",packs:"pack",can:"can",cans:"can",head:"head",heads:"head",slice:"slice",slices:"slice"};
const PLURAL={pc:"pcs",cup:"cups",bunch:"bunches",clove:"cloves",thumb:"thumbs",pack:"packs",can:"cans",head:"heads",slice:"slices"};
const FRAC={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3};
const SECTIONS=[
  ["skip",/^(water|rice wash|water or rice wash)$/],
  ["Pantry",/\b(oil|soy sauce|vinegar|patis|fish sauce|bagoong|sugar|muscovado|salt|pepper|peppercorns?|bay leaf|bay leaves|gata|coconut milk|kakang gata|mix|dried|stock|broth|bouillon|cube|monggo|mung bean|beans?|lentil|sauce|ketchup|honey|spice|paprika|cumin|cinnamon|flour|cornstarch)\b/],
  ["Rice & bread",/\b(rice|oats?|oatmeal|bread|pandesal|noodles?|pasta|bihon|tortilla)\b/],
  ["Meat & poultry",/\b(chicken|pork|beef|liver|ground meat|bacon|ham|sausage|longganisa|tocino|tapa)\b/],
  ["Seafood",/\b(fish|bangus|tilapia|salmon|hipon|shrimp|prawn|tinapa|galunggong|squid|pusit|crab|tuna|sardines?|dilis|mussels?|tahong|clams?)\b/],
  ["Eggs & dairy",/\b(eggs?|milk|cheese|butter|cream|yogurt|kesong)\b/],
  ["Produce",/\b(garlic|onions?|tomato|ginger|kangkong|malunggay|moringa|sitaw|string beans?|green beans?|okra|talong|eggplant|ampalaya|bitter gourd|kalabasa|squash|pumpkin|sayote|chayote|upo|gourd|patola|labanos|radish|saba|banana|kamote|sweet potato|guava|papaya|gabi|taro|sili\w*|siling\w*|chil+i\w*|lemon|calamansi|lime|pechay|bok choy|cabbage|carrots?|potato|lettuce|spinach|mango|sampalok|tamarind|leaves|herbs?|basil|cilantro|parsley|scallions?|spring onions?|celery|cucumber|corn|mushrooms?|bell pepper|avocado|apple|orange|fruit)\b/],
];
function singular(w){return w.replace(/(tomato|potato|mango)es\b/g,"$1").replace(/(\w{3,})ies\b/g,"$1y").replace(/(\w{2,}[^siuo])s\b/g,"$1")}
function parseIng(line){
  let s=String(line).trim(),qty=null,unit="";
  const m=s.match(/^((?:\d+\s+)?\d+\/\d+|\d+(?:\.\d+)?|[½¼¾⅓⅔])(?:\s*[-–]\s*(\d+(?:\.\d+)?))?\s*(.*)$/);
  if(m){const q=m[1];
    if(FRAC[q]!=null)qty=FRAC[q];else if(q.includes("/")){const[a,b]=q.trim().split(/\s+/);qty=b?(+a+eval(b)):eval(a)}else qty=+q;
    if(m[2])qty=Math.max(qty,+m[2]);s=m[3]}
  const w=s.split(/\s+/);const u=(w[0]||"").toLowerCase().replace(/\.$/,"");
  if(qty!=null&&UNITS[u]){unit=UNITS[u];w.shift();s=w.join(" ")}
  s=s.replace(/^of\s+/i,"");
  const name=s.split(/,|\s\(/)[0].trim();
  const keyName=singular(name.toLowerCase().replace(/\s+/g," "));
  const low=name.toLowerCase();let section="Other";for(const[sec,re]of SECTIONS)if(re.test(low)||re.test(keyName)){section=sec;break}
  return {qty,unit:qty!=null?(unit||"pc"):"",name:name||line,key:keyName,section};
}
function fmtQty(n){const w=Math.floor(n+1e-9),f=n-w;const fr=[[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"]].find(([v])=>Math.abs(f-v)<.04);
  if(f<.04)return String(w);if(fr)return (w||"")+fr[1];return String(Math.round(n*100)/100)}
const fmtAmt=(q,u)=>`${fmtQty(q)} ${q>1&&PLURAL[u]?PLURAL[u]:u}`;
function groceryItems(){
  const items=new Map(),wr=weekRecipes();
  for(const[id,times]of wr){const r=S.recipes.get(id);
    for(const line of (r.ing||[])){const p=parseIng(line);if(p.section==="skip")continue;
      let it=items.get(p.key);if(!it){it={key:p.key,name:p.name,section:p.section,amts:{},plain:0,from:new Set()};items.set(p.key,it)}
      if(p.qty!=null)it.amts[p.unit]=(it.amts[p.unit]||0)+p.qty;else it.plain++;
      it.from.add(r.name)}}
  return [...items.values()];
}
const SECTION_ORDER=["Produce","Meat & poultry","Seafood","Eggs & dairy","Rice & bread","Pantry","Other"];

function syncNote(){

  if(S.mode!=="drive")return "";

  if(S.sync==="off")return `<div class="note syncbar"><span>Your recipes are saved on this device. Connect Google Drive to keep them safe, add photos, and use Isa's Kitchen on your phone too.</span><button class="btn primary" data-act="gconnect">Connect Google Drive</button></div>`;

  if(S.sync==="error")return `<div class="note syncbar"><span>${/accessNotConfigured|SERVICE_DISABLED/i.test(S.syncWhy||"")?"Google Drive is switched off for this app. In Google Cloud, open your Isa's Kitchen project and enable the Google Drive API, then try again.":/insufficient|PERMISSION|scope/i.test(S.syncWhy||"")?"Google Drive didn't get permission. Tap Try again and tick the box that lets Isa's Kitchen see the files it creates.":"Couldn't reach Google Drive. Your changes are safe on this device."}${S.syncWhy?` <span class="muted" style="font-size:.8rem">(${esc(S.syncWhy)})</span>`:""}</span><button class="btn" data-act="gsync">Try again</button></div>`;

function renderPlan(){

      <button class="btn primary" data-act="autofill" ${S.readOnly?"disabled":""}>Fill empty meals</button>

function fmtIng(line){
  const m=String(line).match(/^([\d½¼¾⅓⅔./\s-]+(?:kg|g|ml|L|cups?|tbsp|tsp|pcs|pc|bunch(?:es)?|cloves?|thumb|pack|can)?\b)\s*(.*)$/i);
  return m&&m[2]?`<span class="qty">${esc(m[1].trim())}</span> ${esc(m[2])}`:esc(line);
}

/* ---------- fill week from recipes ---------- */
function autofill(){
  const rs=[...S.recipes.values()].sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||a.name.localeCompare(b.name));
  if(!rs.length)return toast("Add a few recipes first");
  const main=rs.filter(r=>["ulam","gulay","sabaw"].includes(r.cat));
  const bulk=main.filter(r=>(r.tags||[]).includes("bulk"));
  const bfast=rs.filter(r=>r.cat==="almusal");
  const lunchPool=bulk.length?bulk:main, dinPool=main.filter(r=>!bulk.includes(r)).length>=3?main.filter(r=>!bulk.includes(r)):main;
  const start=Math.floor(Math.random()*Math.max(1,dinPool.length));
  let n=0,di=0;
  DAYS.forEach(([d],i)=>{
    const put=(m,r)=>{const k=d+"-"+m;if(!parts(S.plan.meals[k]).length&&r){S.plan.meals[k]=["r:"+r.id];n++}};
    if(bfast.length)put("b",bfast[i<5?0:(i%bfast.length)]);
    const lunch=lunchPool.length?lunchPool[Math.floor(i/2)%lunchPool.length]:null;put("l",lunch);
    if(dinPool.length){let r=dinPool[(start+di++)%dinPool.length];if(lunch&&r.id===lunch.id&&dinPool.length>1)r=dinPool[(start+di++)%dinPool.length];put("d",r)}
  });
  if(!n)return toast("Every meal already has something planned");
  savePlan();toast(`Added ${n} meals from your recipes`);
}

let dlNs;
async function getDownloads(){if(dlNs===undefined){try{dlNs=(await window.claude?.use?.("downloads"))||null}catch{dlNs=null}}return dlNs}
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement("script");el.src=src;el.onload=res;el.onerror=()=>rej(new Error("load"));document.head.appendChild(el)})}
async function ensurePdfLibs(){
  if(!window.jspdf)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  if(!window.html2canvas)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
}
const band=()=>`<div class="band">${"<i></i>".repeat(56)}</div>`;
const brandline=sub=>`<div class="brandline"><span class="s">Isa's Kitchen</span><span class="c">${esc(sub)}</span></div>`;
let pdfBusy=false;
async function makePdf(pages,filename){
  if(pdfBusy)return;
  const dl=await getDownloads();
  if(!dl&&S.mode==="db")return toast("Saving files isn't available in this view.");
  pdfBusy=true;toast("Making your PDF…");
  const host=document.createElement("div");host.className="printhost";document.body.appendChild(host);
  try{
    await ensurePdfLibs();try{await document.fonts.ready}catch{}
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});const W=595.28,H=841.89;let first=true;
    for(const html of pages){
      host.innerHTML=html;
      const c=await window.html2canvas(host.firstElementChild,{scale:2,backgroundColor:"#FFFFFF",logging:false,useCORS:true});
      const pageH=Math.floor(c.width*H/W);
      for(let y=0;y<c.height;y+=pageH){
        const h=Math.min(pageH,c.height-y);const sl=document.createElement("canvas");sl.width=c.width;sl.height=h;
        const g=sl.getContext("2d");g.fillStyle="#FFFFFF";g.fillRect(0,0,sl.width,h);g.drawImage(c,0,y,c.width,h,0,0,c.width,h);
        if(!first)pdf.addPage();first=false;
        pdf.addImage(sl.toDataURL("image/jpeg",0.92),"JPEG",0,0,W,h*W/c.width);
      }
    }
    const fname=filename.replace(/[\\/:*?"<>|]/g,"");
    if(dl)await dl.save({filename:fname,data:pdf.output("blob")});else pdf.save(fname);
    toast("PDF saved");
  }catch(e){
    if(e&&e.code==="declined")toast("PDF not saved");
    else if(e&&e.message==="load")toast("Couldn't load the PDF maker. Check your connection and try again.");
    else toast("Couldn't make the PDF. Try again in a moment.");
  }finally{host.remove();pdfBusy=false}
}

function niceDate(k){if(!k)return "";try{return fromKey(k).toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"})}catch{return k}}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};img.src=url;
  });
}
async function addPhoto(id,file){

}

function renderBook(){

    <div class="bookwrap"><div class="spread" id="spread" aria-live="polite"></div>
    <div class="booknav"><button class="iconbtn" data-act="flip" data-d="-1" aria-label="Previous page">‹</button><span id="bookpos"></span><button class="iconbtn" data-act="flip" data-d="1" aria-label="Next page">›</button></div>
    <p class="muted" style="margin:0;font-size:.86rem;text-align:center">Swipe or use the arrow keys to turn pages. Your PDF looks exactly like this.</p></div>`;
}
function layoutBook(){
  const el=$("#spread");if(!el)return;
  const pages=bookPages();const W=el.clientWidth||$("#app").clientWidth;
  const two=W>=720;S.bookTwo=two;
  S.bookPos=Math.max(0,Math.min(S.bookPos,pages.length-1));if(two&&S.bookPos%2)S.bookPos--;
  const idx=two?[S.bookPos,S.bookPos+1]:[S.bookPos];
  const sc=two?Math.min(W/2/794,Math.max(.38,(innerHeight-250)/1123)):Math.min(1,W/794);
  el.innerHTML=idx.map((i,j)=>{const cls=two?(j?"r":"l"):"one";
    return i<pages.length?`<div class="pslot ${cls}"><div class="pscale" style="transform:scale(${sc})">${pageHtml(pages[i],i,pages)}</div></div>`:`<div class="pslot r blank"></div>`}).join("");
  const slots=[...el.querySelectorAll(".pslot")];
  const H=Math.max(1123,...slots.map(s=>s.firstElementChild?s.firstElementChild.firstElementChild.offsetHeight:0));
  slots.forEach(s=>{s.style.width=794*sc+"px";s.style.height=H*sc+"px"});
  const shown=idx.filter(i=>i<pages.length).map(i=>i+1);
  $("#bookpos").textContent=(shown.length>1?`Pages ${shown[0]}–${shown[1]}`:`Page ${shown[0]}`)+` of ${pages.length}`;
}
let flipping=false;const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function flip(d){
  const pages=bookPages();const step=S.bookTwo?2:1;const np=S.bookPos+d*step;
  if(np<0||np>=pages.length||flipping)return;
  const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(calm){S.bookPos=np;return layoutBook()}
  flipping=true;
  try{
    let slots=[...document.querySelectorAll("#spread .pslot")];
    const out=S.bookTwo?(d>0?slots[slots.length-1]:slots[0]):slots[0];
    out.style.transformOrigin=S.bookTwo?(d>0?"left center":"right center"):"left center";
    out.style.transition="transform .26s ease-in";out.style.transform=`rotateY(${d>0?-90:90}deg)`;
    await wait(260);
    S.bookPos=np;layoutBook();
    slots=[...document.querySelectorAll("#spread .pslot")];
    const inn=S.bookTwo?(d>0?slots[0]:slots[slots.length-1]):slots[0];
    inn.style.transformOrigin=S.bookTwo?(d>0?"right center":"left center"):"left center";
    inn.style.transform=`rotateY(${d>0?90:-90}deg)`;void inn.offsetWidth;
    inn.style.transition="transform .28s ease-out";inn.style.transform="rotateY(0deg)";
    await wait(290);inn.style.transition="";inn.style.transform="";
  }finally{flipping=false}
}

document.addEventListener("touchstart",e=>{if(S.view==="book"&&e.target.closest("#spread"))touchX=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(touchX==null)return;const dx=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(dx)>45)flip(dx<0?1:-1)},{passive:true});

  const wl=weekLabel(S.week);
  const rows=DAYS.map(([d,short])=>`<tr><td class="d">${short}</td>${MEALS.map(([m])=>`<td class="m">${mealParts(d+"-"+m).map(p=>esc(p.text)).join("<br>")}</td>`).join("")}</tr>`).join("");
  makePdf([`<div class="pp" style="overflow:hidden">${sprigEl()}${band()}${brandline("Meal plan")}<div class="ey">${esc(wl.range)}</div><h1>This week's table</h1><table><thead><tr><th></th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody>${rows}</tbody></table></div>`],`Meal plan ${S.week}.pdf`);
}

/* ---------- this-device + Google Drive storage (used outside claude.ai) ---------- */
let DATA=null;           // {v:1, recipes:{id:body}, plans:{week:{meals,got,updated}}, deleted:{id:ts}}
const DRIVE={token:null,exp:0,folder:null,photos:null,file:null};
const blobUrls=new Map(),blobLoading=new Set();
let syncing=false,syncAgain=false,syncT=null;

function emptyData(){return {v:1,recipes:{},plans:{},deleted:{}}}
function loadDeviceData(){
  let d=LS.get("data",null);
  if(!d){ // carry over anything saved by the earlier this-browser version
    d=emptyData();const r=LS.get("recipes",{});for(const[id,v]of Object.entries(r))d.recipes[id]={...v,updated:1};
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("kusina:plan:")){const p=JSON.parse(localStorage.getItem(k));d.plans[k.slice(12)]={meals:p.meals||{},got:p.got||{},updated:1}}}}catch{}
  }
  d.recipes=d.recipes||{};d.plans=d.plans||{};d.deleted=d.deleted||{};
  return d;
}
function persistDevice(){LS.set("data",DATA)}
function applyData(){
  S.recipes=new Map(Object.entries(DATA.recipes).map(([id,v])=>[id,{id,...v}]));S.recipesReady=true;
  const p=DATA.plans[S.week]||{};S.plan={meals:{...(p.meals||{})},got:{...(p.got||{})},extras:[...(p.extras||[])]};S.planReady=true;
}
function mergeData(a,b){
  const out=emptyData();
  out.deleted={...a.deleted};for(const[k,t]of Object.entries(b.deleted||{}))out.deleted[k]=Math.max(out.deleted[k]||0,t);
  for(const src of [a.recipes,b.recipes||{}])for(const[id,r]of Object.entries(src)){const cur=out.recipes[id];if(!cur||(r.updated||0)>(cur.updated||0))out.recipes[id]=r}
  for(const[id,r]of Object.entries(out.recipes))if((out.deleted[id]||0)>=(r.updated||0))delete out.recipes[id];
  for(const src of [a.plans,b.plans||{}])for(const[w,p]of Object.entries(src)){const cur=out.plans[w];if(!cur||(p.updated||0)>(cur.updated||0))out.plans[w]=p}
  return out;
}
function deviceChanged(){persistDevice();if(S.mode==="drive"&&DRIVE.token){clearTimeout(syncT);syncT=setTimeout(syncDrive,1200)}}

/* Google sign-in (drive.file: the app only sees files it created) */
const driveReady=()=>!!GOOGLE_CLIENT_ID&&!window.claude;
function tokenValid(){return DRIVE.token&&Date.now()<DRIVE.exp}
function restoreToken(){try{const t=JSON.parse(sessionStorage.getItem("isa:gt")||"null");if(t&&Date.now()<t.exp){DRIVE.token=t.token;DRIVE.exp=t.exp}}catch{}}
function connectDrive(){
  loadScript("https://accounts.google.com/gsi/client").then(()=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.file",
      callback:t=>{if(t.error){S.sync="off";render();return toast("Google Drive wasn't connected.")}
        DRIVE.token=t.access_token;DRIVE.exp=Date.now()+(Number(t.expires_in||3600)-90)*1000;
        try{sessionStorage.setItem("isa:gt",JSON.stringify({token:DRIVE.token,exp:DRIVE.exp}))}catch{}
        LS.set("drive",{on:true});syncDrive()},
      error_callback:()=>{toast("Google sign-in was closed.");render()}});
    tc.requestAccessToken({prompt:LS.get("drive",{}).on?"":"consent"});
  }).catch(()=>toast("Couldn't reach Google. Check your connection."));
}
function disconnectDrive(){
  try{if(DRIVE.token&&window.google)google.accounts.oauth2.revoke(DRIVE.token,()=>{})}catch{}
  DRIVE.token=null;DRIVE.exp=0;DRIVE.folder=DRIVE.photos=DRIVE.file=null;
  try{sessionStorage.removeItem("isa:gt")}catch{}LS.set("drive",{on:false});S.sync="off";render();toast("Google Drive disconnected. Your recipes stay on this device.");
}
async function gfetch(path,opt={}){
  if(!tokenValid()){S.sync="auth";throw {auth:true}}
  const r=await fetch("https://www.googleapis.com/"+path,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+DRIVE.token}});
  if(r.status===401){DRIVE.token=null;S.sync="auth";throw {auth:true}}
  if(!r.ok){let why="";try{const j=await r.json();why=(j.error&&(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason||j.error.status||j.error.message))||""}catch{}
    const err=new Error("drive "+r.status);err.status=r.status;err.why=why;throw err}
  return r;
}
async function findOne(q){const r=await gfetch("drive/v3/files?spaces=drive&fields=files(id)&q="+encodeURIComponent(q+" and trashed=false"));return (await r.json()).files[0]?.id||null}
const qs=v=>String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); // Drive search needs quotes escaped
async function ensureFolder(name,parent){
  const q=`name='${qs(name)}' and mimeType='application/vnd.google-apps.folder' and '${parent||"root"}' in parents`;
  const id=await findOne(q);if(id)return id;
  const r=await gfetch("drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent||"root"]})});
  return (await r.json()).id;
}
async function multipartCreate(meta,blob){
  const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));fd.append("file",blob);
  const r=await gfetch("upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd});return (await r.json()).id;
}
async function syncDrive(){
  if(syncing){syncAgain=true;return}
  if(!tokenValid()){S.sync="auth";return render()}
  syncing=true;S.sync="syncing";render();
  try{
    if(!DRIVE.folder)DRIVE.folder=await ensureFolder("Isa's Kitchen");
    if(!DRIVE.photos)DRIVE.photos=await ensureFolder("Photos",DRIVE.folder);
    if(!DRIVE.file)DRIVE.file=await findOne(`name='isas-kitchen-data.json' and '${DRIVE.folder}' in parents`);
    let remote=null;
    if(DRIVE.file){const r=await gfetch(`drive/v3/files/${DRIVE.file}?alt=media`);try{remote=await r.json()}catch{remote=null}}
    DATA=remote?mergeData(DATA,remote):DATA;persistDevice();applyData();
    const body=new Blob([JSON.stringify(DATA)],{type:"application/json"});
    if(DRIVE.file)await gfetch(`upload/drive/v3/files/${DRIVE.file}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});
    else DRIVE.file=await multipartCreate({name:"isas-kitchen-data.json",parents:[DRIVE.folder],mimeType:"application/json"},body);
    S.sync="ok";S.syncedAt=Date.now();
    prefetchPhotos();
  }catch(e){S.sync=e&&e.auth?"auth":"error";S.syncWhy=e&&(e.why||e.status)?String(e.why||e.status):"";console.warn("Google Drive sync failed",e)}
  finally{syncing=false;render();if(syncAgain){syncAgain=false;syncDrive()}}
}
addEventListener("focus",()=>{if(S.mode==="drive"&&tokenValid()&&Date.now()-(S.syncedAt||0)>20000)syncDrive()});

/* photos: one interface for claude.ai storage and Google Drive */
async function loadPhoto(id){
  if(blobUrls.has(id)||blobLoading.has(id)||!tokenValid())return;
  blobLoading.add(id);
  try{const r=await gfetch(`drive/v3/files/${id}?alt=media`);blobUrls.set(id,URL.createObjectURL(await r.blob()));render();
    if(PH.sheetRecipe&&$("#sheetRoot").innerHTML&&$("#sheetRoot .photos"))openRecipe(PH.sheetRecipe)}
  catch{}finally{blobLoading.delete(id)}
}
function prefetchPhotos(){for(const r of S.recipes.values())for(const p of (r.photos||[]))loadPhoto(p.id)}
const PH={
  sheetRecipe:null,
  on(){return S.mode==="db"?!!assetsNs:(S.mode==="drive"&&tokenValid())},
  url(id){if(!id)return "";if(S.mode==="db")return "/_blob/"+id;const u=blobUrls.get(id);if(!u)loadPhoto(id);return u||""},
  async upload(blob){
    if(S.mode==="db")return assetsNs.upload(blob);
    if(!DRIVE.photos)await syncDrive();
    const id=await multipartCreate({name:`photo-${Date.now()}.jpg`,parents:[DRIVE.photos],mimeType:"image/jpeg"},blob);
    blobUrls.set(id,URL.createObjectURL(blob));return {id};
  },
  del(id){if(S.mode==="db"){assetsNs&&assetsNs.delete(id).catch(()=>{});return}
    gfetch(`drive/v3/files/${id}`,{method:"DELETE"}).catch(()=>{});const u=blobUrls.get(id);if(u){URL.revokeObjectURL(u);blobUrls.delete(id)}}
};

/* backup: move recipes and plans between versions of the app */
async function exportBackup(){
  let data;
  if(S.mode==="db"){
    const plans={};try{const snap=await db.collection("plans").get();snap.docs.forEach(d=>plans[d.id]=d.data())}catch{}
    const recipes={};for(const[id,r]of S.recipes){const{id:_,...b}=r;recipes[id]=b}
    data={v:1,recipes,plans,deleted:{}};
  } else data=DATA;
  const text=JSON.stringify(data,null,1),name=`isas-kitchen-backup-${key(new Date())}.json`;
  const dl=await getDownloads();
  if(dl){try{await dl.save({filename:name,data:text});toast("Backup saved")}catch(e){toast(e&&e.code==="declined"?"Backup not saved":"Couldn't save the backup")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Backup saved");
}
async function importBackup(file){
  let incoming;try{incoming=JSON.parse(await file.text())}catch{return toast("That file isn't an Isa's Kitchen backup.")}
  if(!incoming||typeof incoming.recipes!=="object")return toast("That file isn't an Isa's Kitchen backup.");
  const now=Date.now();
  const recipes=Object.fromEntries(Object.entries(incoming.recipes).map(([id,r])=>[id,{...r,photos:S.mode==="db"?r.photos:(r.photos||[]).filter(p=>!/^[0-9a-f]{32}$/.test(p.id)),updated:r.updated||now}]));
  const plans=Object.fromEntries(Object.entries(incoming.plans||{}).map(([w,p])=>[w,{meals:p.meals||{},got:p.got||{},extras:p.extras||[],updated:p.updated||now}]));
  if(S.mode==="db"){
    for(const[id,r]of Object.entries(recipes)){const{updated,...b}=r;saveRecipe({id,...b})}
    for(const[w,p]of Object.entries(plans))queue(()=>db.doc("plans/"+w).set({meals:p.meals,got:p.got,extras:p.extras,week:w}));
  } else {DATA=mergeData(DATA,{recipes,plans,deleted:{}});applyData();deviceChanged();render()}
  toast(`Imported ${Object.keys(recipes).length} recipes and ${Object.keys(plans).length} weeks`);
}

/* ---------- painted lemons on thin ticking stripes (canvas, fixed seed: same picture every visit) ---------- */
const PAINTS={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return (r()+r()+r()+r()-2)/1.15}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function deform(pts,depth,r){
  for(let d=0;d<depth;d++){const out=[];
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];out.push(a);
      const len=Math.hypot(b[0]-a[0],b[1]-a[1]),v=(a[2]+b[2])/2;
      out.push([(a[0]+b[0])/2+gauss(r)*len*v*.5,(a[1]+b[1])/2+gauss(r)*len*v*.5,Math.max(.04,v*(.55+r()*.6))])}
    pts=out}
  return pts;
}
function trace(ctx,p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath()}
function wash(ctx,base,rgb,layers,alpha,r,edge){
  const b=deform(base,2,r);ctx.fillStyle=`rgba(${rgb},${alpha})`;
  for(let i=0;i<layers;i++){trace(ctx,deform(b,2,r));ctx.fill()}
  if(edge){ctx.strokeStyle=`rgba(${rgb},${edge})`;ctx.lineWidth=.8;trace(ctx,deform(b,1,r));ctx.stroke()}
}
const GREENS=["104,140,84","120,154,96","92,128,76"];
function rot(pts,x,y,ang){const c=Math.cos(ang),s=Math.sin(ang);return pts.map(([px,py,v])=>[x+px*c-py*s,y+px*s+py*c,v])}
function leaf(ctx,x,y,L,ang,r){
  const W=L*.32,pts=[];
  for(let i=0;i<=8;i++){const t=i/8;pts.push([t*L,-Math.pow(Math.sin(Math.PI*t),.8)*W*(1-.3*t),.22])}
  for(let i=7;i>0;i--){const t=i/8;pts.push([t*L,Math.pow(Math.sin(Math.PI*t),.8)*W*(1-.3*t),.22])}
  const tp=rot(pts,x,y,ang);
  wash(ctx,tp,GREENS[Math.floor(r()*GREENS.length)],5,.16,r,.24);
  const c=Math.cos(ang),s=Math.sin(ang),P=(px,py)=>[x+px*c-py*s,y+px*s+py*c];
  ctx.strokeStyle="rgba(58,92,52,.5)";ctx.lineWidth=1.1;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(...P(L*.04,0));ctx.quadraticCurveTo(...P(L*.5,-W*.06),...P(L*.92,0));ctx.stroke();
}
function lemon(ctx,x,y,S,ang,r){
  // an oval with a little nub at each end
  const pts=[];const n=18;
  for(let i=0;i<n;i++){const t=i/n*Math.PI*2;let px=Math.cos(t)*S,py=Math.sin(t)*S*.8;
    const tip=Math.pow(Math.abs(Math.cos(t)),16);px*=1+tip*.16;py*=1-tip*.4;pts.push([px,py,.14])}
  const tp=rot(pts,x,y,ang);
  wash(ctx,tp,"247,214,74",7,.2,r,.3);
  wash(ctx,rot(pts.map(([a,b])=>[a*.92+S*.05,b*.85+S*.12,.2]),x,y,ang),"232,180,40",3,.12,r); // shade underneath
  wash(ctx,rot(pts.map(([a,b])=>[a*.22-S*.3,b*.18-S*.26,.2]),x,y,ang),"255,252,235",2,.22,r); // soft highlight
  ctx.fillStyle="rgba(200,150,30,.18)";
  for(let i=0;i<14;i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*S*.7;ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*.7,.7,0,7);ctx.fill()}
}
function branch(ctx,x,y,S,ang,r,count){
  const c=Math.cos(ang),s=Math.sin(ang),P=(px,py)=>[x+px*c-py*s,y+px*s+py*c];
  ctx.strokeStyle="rgba(110,92,60,.6)";ctx.lineWidth=Math.max(1.6,S*.05);ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(...P(0,0));ctx.bezierCurveTo(...P(S*.8,-S*.1),...P(S*1.6,S*.1),...P(S*2.4,0));ctx.stroke();
  leaf(ctx,...P(S*.5,-S*.05),S*1.1,ang-.9+gauss(r)*.15,r);
  leaf(ctx,...P(S*1.2,0),S*1.2,ang+.85+gauss(r)*.15,r);
  leaf(ctx,...P(S*1.9,0),S*1.0,ang-.6+gauss(r)*.15,r);
  leaf(ctx,...P(S*2.3,0),S*.9,ang+.2,r);
  const k=count||2;
  lemon(ctx,...P(S*1.0,S*.75),S*.62,ang+1.3+gauss(r)*.2,r);
  if(k>1)lemon(ctx,...P(S*1.75,S*.85),S*.56,ang+1.6+gauss(r)*.2,r);
  if(k>2)lemon(ctx,...P(S*.4,S*.65),S*.5,ang+1.1,r);
}
function paintStripes(ctx,w,h){ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,w,h);ctx.fillStyle="#D5E2F3";for(let x=0;x<w;x+=14)ctx.fillRect(x,0,3,h)}
function canvasFor(w,h){const k=Math.min(2,window.devicePixelRatio||1)||1;const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  const ctx=c.getContext("2d");ctx.scale(k,k);return [c,ctx]}
function paint(name){
  if(name in PAINTS)return PAINTS[name];
  let c,ctx,r,url="";
  try{
    if(name==="tick"){[c,ctx]=canvasFor(14,14);paintStripes(ctx,14,14);url=c.toDataURL("image/png")}
    else if(name==="sprig"){[c,ctx]=canvasFor(300,240);r=mulberry(5);branch(ctx,18,60,70,.28,r,2);url=c.toDataURL("image/png")}
    else if(name==="sprig2"){[c,ctx]=canvasFor(300,240);r=mulberry(9);branch(ctx,282,70,68,Math.PI-.3,r,2);url=c.toDataURL("image/png")}
    else if(name==="cover"){
      const w=794,h=1123;[c,ctx]=canvasFor(w,h);paintStripes(ctx,w,h);r=mulberry(33);
            url=c.toDataURL("image/jpeg",.9);
    }else if(name.startsWith("hero:")){
      const w=794,h=700;[c,ctx]=canvasFor(w,h);paintStripes(ctx,w,h);r=mulberry(hashStr(name));
            url=c.toDataURL("image/jpeg",.9);
    }
  }catch{url=""}
  PAINTS[name]=url;return url;
}
const BOW=()=>"";
function paintGarden(){
  const run=()=>{const a=$("#lemL"),b=$("#lemR");if(a){a.src=paint("sprig")}if(b){b.src=paint("sprig2")}};
  (window.requestIdleCallback||((f)=>setTimeout(f,30)))(run);
}

init();
paintGarden();
if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
